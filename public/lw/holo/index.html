<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Liza 3D Explorer</title>
<link rel="stylesheet" href="styles.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.min.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head>
<body>
<!-- Icons, drawn once and reused: glyphs from fonts came out differently on the Pi. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5" /></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
    <symbol id="i-turn" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-3-6.2M17 2.5v3.6h-3.6" /></symbol>
    <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" /></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v6M12 7.5v.5" /></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z" /><circle cx="7.5" cy="8.5" r="1.3" /></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" /></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5" /></symbol>
    <symbol id="i-apart" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" /><path d="M14 10l-4 4" /></symbol>
    <symbol id="i-fade" viewBox="0 0 24 24"><circle cx="9" cy="12" r="6" /><circle cx="15" cy="12" r="6" stroke-dasharray="2 2.5" /></symbol>
    <symbol id="i-motion" viewBox="0 0 24 24"><path d="M4 18c4-10 12-10 16 0M8 6l-2 3M16 6l2 3" /></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2" /><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" /></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M5 15l7-7 7 7" /></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /><circle cx="12" cy="12" r="2.5" /></symbol>
    <symbol id="i-solo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" /><circle cx="12" cy="12" r="9" stroke-dasharray="2 3" /></symbol>
    <symbol id="i-hide" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7c2 0 3.7.6 5.1 1.6M22 12s-3.6 7-10 7c-2 0-3.7-.6-5.1-1.6M4 20L20 4" /></symbol>
    <symbol id="i-ask" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z" /><path d="M10 9.2a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4M12 14v.3" /></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" /><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" /></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" /></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="18" cy="12" r="1.6" /></symbol>
    <symbol id="i-inside" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M16 16l5 5M11 8v6M8 11h6" /></symbol>
  </defs>
</svg>

<canvas id="view"></canvas>
<svg id="leaders"></svg>
<div id="labelLayer"></div>

<header id="top">
  <button id="back" class="ibtn" aria-label="Back"><svg><use href="#i-back"/></svg><span>Back</span></button>
  <div id="titlebox"><span id="title">3D Explorer</span><span id="badge" class="badge"></span></div>
  <button id="liza" class="lizabtn idle" aria-label="Talk to Liza"><svg><use id="liza-icon" href="#i-mic"/></svg><span id="liza-text">Talk</span></button>
  <button id="credits" class="ibtn round" aria-label="About this model"><svg><use href="#i-info"/></svg></button>
</header>

<nav id="rail">
  <button id="home" class="rbtn" aria-label="Whole model"><svg><use href="#i-home"/></svg><span>Home</span></button>
  <button id="zoomin" class="rbtn" aria-label="Zoom in"><svg><use href="#i-plus"/></svg><span>Closer</span></button>
  <button id="zoomout" class="rbtn" aria-label="Zoom out"><svg><use href="#i-minus"/></svg><span>Further</span></button>
  <button id="mode" class="rbtn" aria-label="Turn or move"><svg><use id="mode-icon" href="#i-turn"/></svg><span id="mode-text">Turn</span></button>
</nav>

<div id="formula"></div>
<div id="toast"></div>

<nav id="dock"></nav>

<div id="tourbar">
  <button id="tour-prev" class="ibtn round" aria-label="Previous"><svg><use href="#i-back"/></svg></button>
  <div id="tour-body"><span id="tour-count"></span><p id="tour-text"></p></div>
  <button id="tour-next" class="ibtn primary"><span>Next</span><svg><use href="#i-next"/></svg></button>
  <button id="tour-stop" class="ibtn round" aria-label="End tour"><svg><use href="#i-close"/></svg></button>
</div>

<aside id="panel">
  <div id="p-head">
    <button id="p-parent" class="link"><svg><use href="#i-up"/></svg><span id="p-parent-text"></span></button>
    <h2 id="p-name"></h2>
    <button id="p-close" class="ibtn round small" aria-label="Close"><svg><use href="#i-close"/></svg></button>
  </div>
  <div id="p-scroll">
    <p id="p-desc"></p>
    <p id="p-func"></p>
    <ul id="p-facts"></ul>
    <div id="p-terms"></div>
    <p id="p-answer"></p>
  </div>
  <div id="p-actions">
    <button id="p-focus" class="abtn"><svg><use href="#i-focus"/></svg><span>Zoom to it</span></button>
    <button id="p-isolate" class="abtn"><svg><use href="#i-solo"/></svg><span>Only this</span></button>
    <button id="p-hide" class="abtn"><svg><use href="#i-hide"/></svg><span>Hide</span></button>
    <button id="p-inside" class="abtn wide"><svg><use href="#i-inside"/></svg><span>Look inside</span></button>
    <button id="p-ask" class="abtn ask"><svg><use href="#i-ask"/></svg><span>Ask Liza</span></button>
  </div>
</aside>

<div id="creditbox"></div>

<div id="loading"><div class="ring"></div><p id="load-text"></p><div class="track"><div id="load-bar"></div></div></div>
<div id="error"><p id="err-text"></p><div class="row"><button id="err-retry" class="ibtn primary"><span>Try again</span></button><button id="err-back" class="ibtn"><span>Back to Liza</span></button></div></div>

<script type="module" src="app.js"></script>
</body>
</html>
